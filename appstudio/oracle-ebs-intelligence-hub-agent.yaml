# =============================================================================
# =============================================================================
# Oracle EBS Intelligence Hub — IBM BOB Agent Configuration
# Version:    5.0
# Updated:    2025
# Platform:   IBM App Studio + ICA Context Studio
# App:        oracle-ebs-intelligence-hub.html  (Pure client-side SPA, zero backend)
# Context:    oracle-ebs-intelligence-hub
# =============================================================================
#
# COVERAGE CHECKLIST — every feature of the v5.0 app is represented here:
#
#  ✅ 7 Application Tabs    — Chat, Reports, SQL Advisor, Academy, SQL Lab, Data Connect, Doc Generator
#  ✅ 2 Login Roles         — Employee (3 tabs) / Technical (all 7 tabs)
#  ✅ 26 EBS Reports        — AP×9, PO×4, GL×3, iExpense×3, HRMS×4, AR×2, INV×1
#  ✅ SQL Advisor           — Performance Advisor, 27-check Code Review, Formatter
#  ✅ EBS Academy           — 15 modules with AI assistant (40+ handlers)
#  ✅ SQL Lab               — 500+ queries, AI Prompt-to-SQL, 12 categories
#  ✅ Data Connect          — Excel/CSV upload, Simulated DB, Live Oracle DB (proxy)
#  ✅ Doc Generator         — TDD + FSD with 4 SVG diagrams
#  ✅ Delete Workflow       — Employee request → Technical approve/reject + Recycle Bin
#  ✅ Notification Panel    — Pending requests badge + Recycle Bin restore
#  ✅ Chart Visualisation   — Bar, Line, Pie, Doughnut per report
#  ✅ Export Formats        — CSV, Excel, PDF
#  ✅ ICA Context           — Knowledge graph, NL query CSV, entity resolution
#
# =============================================================================

agent:
  name: oracle-ebs-intelligence-hub-assistant
  version: "5.0"
  description: >
    AI assistant for Oracle EBS Intelligence Hub v5.0.
    Handles natural-language queries for 26 Oracle EBS reports across
    AP, AR, GL, PO, HRMS, INV and iExpense modules; SQL performance analysis,
    27-check code review and formatting; EBS Academy (15 modules) topic lookup
    with process flowcharts; SQL Lab (500+ queries) prompt-to-SQL generation;
    Data Connect (Excel/CSV upload and DB query simulation); Document Generator
    (TDD + FSD); Delete/Recycle Bin workflow; and role-based tab navigation
    (Employee sees Chat + Reports + Data Connect; Technical sees all 7 tabs).
    Zero backend — all logic runs client-side. No LLM API calls.
  language: en
  context: oracle-ebs-intelligence-hub
  fallback_intent: show_help_menu
  confidence_threshold: 0.70
  app_file: oracle-ebs-intelligence-hub.html
  app_version: "5.0"
  roles:
    - id: employee
      password_hint: "see local ebs-credentials.js"
      visible_tabs: [tab-chat, tab-reports, tab-dataconnect]
      delete_mode: submit_request
    - id: technical
      password_hint: "see local ebs-credentials.js"
      visible_tabs: [tab-chat, tab-reports, tab-dataconnect, tab-sql, tab-academy, tab-sqllab, tab-docgen]
      delete_mode: direct_with_recycle_bin
      notification_bell: true

# =============================================================================
# ENTITIES
# =============================================================================
entities:

  # ── Oracle EBS Module ───────────────────────────────────────────────────────
  - name: report_module
    type: closed_list
    context_node_type: OracleModule
    values:
      - AP
      - AR
      - GL
      - PO
      - HRMS
      - INV
      - iExpense
    synonyms:
      AP: [Accounts Payable, payables, vendor invoices]
      AR: [Accounts Receivable, receivables, customer invoices]
      GL: [General Ledger, ledger, journals]
      PO: [Purchasing, procurement, purchase orders]
      HRMS: [Human Resources, HR, employees, payroll]
      INV: [Inventory, stock, warehouse]
      iExpense: [expense reports, employee expenses, corporate card]

  # ── Specific EBS Report ─────────────────────────────────────────────────────
  - name: report_name
    type: context_lookup
    context_node_type: EBSReport
    lookup_property: title

  # ── Report Key (internal ID) ────────────────────────────────────────────────
  - name: report_key
    type: closed_list
    values:
      # AP
      - aged_payables_detail
      - invoice_register
      - ap_trial_balance
      - withholding_tax
      - suppliers_report
      - suppliers_high_payments_by_year
      - supplier_paid_invoice_history
      - supplier_payment_history
      - supplier_audit
      # PO
      - po_detail
      - po_distribution_detail
      - receipt_adjustments
      - savings_analysis
      # GL
      - gl_journals
      - gl_trial_balance
      - gl_account_analysis
      # iExpense
      - iexpense_detail
      - credit_card_report
      - workflow_approvals
      # HRMS
      - active_employees
      - terminated_employees
      - supervisor_details
      - expense_cost_allocation
      # AR
      - ar_aging
      - customer_statement
      # INV
      - inventory_valuation

  # ── Fiscal Year ─────────────────────────────────────────────────────────────
  - name: fiscal_year
    type: pattern
    pattern: "(FY)?20(2[0-9])"
    example: "FY2024, 2023, FY2022"

  # ── Month ───────────────────────────────────────────────────────────────────
  - name: month_name
    type: closed_list
    values:
      - January
      - February
      - March
      - April
      - May
      - June
      - July
      - August
      - September
      - October
      - November
      - December
    synonyms:
      January: [Jan]
      February: [Feb]
      March: [Mar]
      April: [Apr]
      June: [Jun]
      July: [Jul]
      August: [Aug]
      September: [Sep, Sept]
      October: [Oct]
      November: [Nov]
      December: [Dec]

  # ── Export Format ───────────────────────────────────────────────────────────
  - name: export_format
    type: closed_list
    values: [csv, excel, xlsx, pdf, print]

  # ── SQL Advisor Sub-tab ─────────────────────────────────────────────────────
  - name: sql_advisor_subtab
    type: closed_list
    values: [performance, code_review, formatter]
    synonyms:
      performance: [perf, optimise, slow, execution plan, cost]
      code_review:  [review, standards, quality, check, best practice]
      formatter:    [format, beautify, indent, clean, uppercase keywords]

  # ── Academy Module ──────────────────────────────────────────────────────────
  - name: academy_module
    type: closed_list
    context_node_type: AcademyModule
    values:
      - acad_ap
      - acad_ar
      - acad_gl
      - acad_iexp
      - acad_hrms
      - acad_po
      - acad_inv
      - acad_concurrent
      - acad_dba
      - acad_arch
      - acad_soa
      - acad_apex
      - acad_testing
      - acad_security
      - acad_pm
    synonyms:
      acad_ap:         [accounts payable, AP module, invoice cycle, P2P]
      acad_ar:         [accounts receivable, AR module, O2C, cash receipts]
      acad_gl:         [general ledger, GL module, period close, journals]
      acad_iexp:       [iExpense, expense reports, credit card, corporate card]
      acad_hrms:       [HRMS, HR module, hire to retire, employees, payroll]
      acad_po:         [purchasing, PO module, purchase orders, procurement]
      acad_inv:        [inventory, INV module, stock, warehouse]
      acad_concurrent: [concurrent programs, background jobs, request submission]
      acad_dba:        [DBA, database admin, patching, performance tuning, RMAN]
      acad_arch:       [architecture, three-tier, AD utilities, EBS infrastructure]
      acad_soa:        [SOA, integration, BPEL, web services, REST API, OIC]
      acad_apex:       [APEX, Oracle APEX, modernisation, low-code, EBS migration]
      acad_testing:    [testing, QA, regression, UAT, test plan]
      acad_security:   [security, responsibilities, SOD, user access, audit]
      acad_pm:         [project manager, project management, cutover, go-live]

  # ── SQL Library Category ────────────────────────────────────────────────────
  - name: sql_category
    type: closed_list
    context_node_type: SQLCategory
    values:
      - cat_ap
      - cat_ar
      - cat_gl
      - cat_po
      - cat_hrms
      - cat_inv
      - cat_iexp
      - cat_fnd
      - cat_perf
      - cat_sec
      - cat_wf
      - cat_multi

  # ── Data Connect Source ─────────────────────────────────────────────────────
  - name: data_connect_source
    type: closed_list
    values: [excel, csv, simulated, live_db]
    synonyms:
      excel:     [xlsx, spreadsheet, file upload, drag and drop]
      csv:       [csv file, comma separated]
      simulated: [simulate, demo, test, no db, without database]
      live_db:   [live database, oracle db, real data, jdbc, production]

  # ── Document Type ───────────────────────────────────────────────────────────
  - name: doc_type
    type: closed_list
    values: [TDD, FSD, technical, functional, specification]
    synonyms:
      TDD:       [technical design document, technical spec, technical specification]
      FSD:       [functional spec, functional design, business spec, functional design document]

  # ── User Role ───────────────────────────────────────────────────────────────
  - name: user_role
    type: closed_list
    values: [employee, technical]
    synonyms:
      employee:  [business user, end user, finance user, standard user]
      technical: [developer, DBA, power user, admin, technical user]

  # ── Delete Action ───────────────────────────────────────────────────────────
  - name: delete_action
    type: closed_list
    values: [request, approve, reject, restore]

  # ── Vendor / Supplier ───────────────────────────────────────────────────────
  - name: vendor_name
    type: context_lookup
    context_node_type: Supplier
    lookup_property: name

  # ── Employee ────────────────────────────────────────────────────────────────
  - name: employee_name
    type: context_lookup
    context_node_type: Employee
    lookup_property: full_name

# =============================================================================
# SLOTS
# =============================================================================
slots:

  - name: s_module
    type: entity
    entity: report_module
    prompt: "Which Oracle EBS module? (AP, AR, GL, PO, HRMS, INV, iExpense)"

  - name: s_year
    type: entity
    entity: fiscal_year
    prompt: "Which fiscal year? (e.g., 2024, FY2023, or type 'all' for all years)"

  - name: s_month
    type: entity
    entity: month_name
    prompt: "Which month? (e.g., March, October)"

  - name: s_vendor
    type: entity
    entity: vendor_name
    prompt: "Which supplier or vendor name?"

  - name: s_employee
    type: entity
    entity: employee_name
    prompt: "Which employee (full name or employee number)?"

  - name: s_export
    type: entity
    entity: export_format
    prompt: "Download format? CSV, Excel (.xlsx), or PDF?"

  - name: s_doc_type
    type: entity
    entity: doc_type
    prompt: "Technical Design Document (TDD), Functional Specification (FSD), or both?"

  - name: s_academy_module
    type: entity
    entity: academy_module
    prompt: "Which Academy module? (e.g., AP, GL, HRMS, DBA, Architecture, SOA)"

  - name: s_sql_category
    type: entity
    entity: sql_category
    prompt: "Which SQL category? (AP, AR, GL, PO, HRMS, INV, iExpense, FND, Performance, Security, Workflow, Multi-Org)"

  - name: s_data_source
    type: entity
    entity: data_connect_source
    prompt: "Data source: Excel/CSV upload, Simulated DB query, or Live Oracle DB?"

  - name: s_delete_action
    type: entity
    entity: delete_action
    prompt: "Action: submit delete request, approve, reject, or restore from Recycle Bin?"

  - name: s_report_key
    type: entity
    entity: report_key
    prompt: "Which report? (e.g., aged_payables_detail, active_employees)"

# =============================================================================
# SKILLS
# =============================================================================
skills:

  # ────────────────────────────────────────────────────────────────────────────
  # GROUP 1 — EBS REPORTS (26 reports across 7 modules)
  # ────────────────────────────────────────────────────────────────────────────

  - skill: generate_ap_report
    description: >
      Show AP reports — Aged Payables Detail, Invoice Register, AP Trial Balance,
      Withholding Tax, Supplier Paid Invoice History, Supplier Payment History.
    intents:
      - aged_payables
      - invoice_register
      - ap_trial_balance
      - withholding_tax
      - paid_invoice_history
      - payment_history
    training_phrases:
      - "show aged payables"
      - "aged payables report"
      - "outstanding invoices"
      - "overdue payables"
      - "AP aging"
      - "what invoices are past due"
      - "unpaid invoices"
      - "invoice register"
      - "all AP invoices entered this month"
      - "AP trial balance"
      - "vendor open balance"
      - "withholding tax by supplier"
      - "1099 report"
      - "TDS by supplier"
      - "supplier paid invoice history"
      - "what did we pay to this vendor"
      - "supplier payment history"
    slots_required: [s_year, s_month]
    response:
      type: report_action
      report_key_map:
        aged_payables:      aged_payables_detail
        invoice_register:   invoice_register
        ap_trial_balance:   ap_trial_balance
        withholding_tax:    withholding_tax
        paid_invoice_history: supplier_paid_invoice_history
        payment_history:    supplier_payment_history
    fallback: >
      AP reports available: Aged Payables Detail, Invoice Register, AP Trial Balance,
      Withholding Tax, Supplier Paid Invoice History, Supplier Payment History.
      Which would you like?

  - skill: generate_supplier_report
    description: >
      Show supplier-related reports — Suppliers List, High Payments by Year,
      Supplier Audit Trail.
    intents:
      - supplier_list
      - high_payment_suppliers
      - supplier_audit
    training_phrases:
      - "show all suppliers"
      - "vendor list"
      - "supplier report"
      - "suppliers on hold"
      - "suppliers with high payments"
      - "top vendors by payment"
      - "which vendors got paid the most"
      - "3 year payment analysis"
      - "supplier audit trail"
      - "vendor changes"
      - "supplier bank account changes"
    slots_required: [s_year, s_vendor]
    response:
      type: report_action
      report_key_map:
        supplier_list:           suppliers_report
        high_payment_suppliers:  suppliers_high_payments_by_year
        supplier_audit:          supplier_audit
    fallback: >
      Supplier reports: Suppliers Report, High Payments by Year, Supplier Audit Trail.

  - skill: generate_po_report
    description: >
      Show Purchasing reports — PO Detail, PO Distribution Detail,
      Receipt Adjustments, Savings Analysis.
    intents:
      - po_detail
      - po_distribution
      - receipt_adjustments
      - savings_analysis
    training_phrases:
      - "purchase orders"
      - "PO detail report"
      - "PO status this month"
      - "approved purchase orders"
      - "PO distribution"
      - "accounting distributions for PO"
      - "GL accounts for purchase orders"
      - "receipt adjustments"
      - "receiving adjustments"
      - "savings analysis"
      - "procurement savings"
      - "buyer savings report"
    slots_required: [s_year, s_month]
    response:
      type: report_action
      report_key_map:
        po_detail:          po_detail
        po_distribution:    po_distribution_detail
        receipt_adjustments: receipt_adjustments
        savings_analysis:   savings_analysis
    fallback: >
      PO reports: Purchase Order Detail, Distribution Detail, Receipt Adjustments, Savings Analysis.

  - skill: generate_gl_report
    description: >
      Show General Ledger reports — Journal Entries, GL Trial Balance,
      Account Analysis.
    intents:
      - gl_journals
      - gl_trial_balance
      - account_analysis
    training_phrases:
      - "journal entries"
      - "GL journals"
      - "general ledger entries"
      - "posted journals this period"
      - "GL trial balance"
      - "account balances"
      - "period end balance"
      - "account analysis"
      - "GL account activity"
      - "ledger report"
    slots_required: [s_year, s_month]
    response:
      type: report_action
      report_key_map:
        gl_journals:      gl_journals
        gl_trial_balance: gl_trial_balance
        account_analysis: gl_account_analysis
    fallback: "GL reports: Journal Entries, GL Trial Balance, Account Analysis."

  - skill: generate_iexpense_report
    description: >
      Show iExpense reports — iExpense Detail, Credit Card Report,
      Workflow Approvals.
    intents:
      - iexpense_detail
      - credit_card
      - workflow_approvals
    training_phrases:
      - "iExpense reports"
      - "expense reports"
      - "employee expenses"
      - "expense pending approval"
      - "show my expenses"
      - "credit card report"
      - "corporate card transactions"
      - "card statement"
      - "workflow approvals"
      - "approval status"
      - "pending expense approvals"
      - "expense workflow"
      - "expenses not yet approved"
    slots_required: [s_year, s_employee]
    response:
      type: report_action
      report_key_map:
