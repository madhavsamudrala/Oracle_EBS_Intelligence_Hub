  # ────────────────────────────────────────────────────────────────────────────
  # GROUP 4 — SQL LAB (Technical only — tab-sqllab)
  # ────────────────────────────────────────────────────────────────────────────

  - skill: sql_lab_prompt_to_sql
    description: >
      Use SQL Lab AI to convert a natural-language prompt into an Oracle EBS
      SQL query. 500+ pre-written queries, keyword scoring, out-of-scope detection.
    role_required: technical
    intents:
      - generate_sql
      - sql_from_prompt
      - write_sql_query
    training_phrases:
      - "generate SQL for unpaid invoices"
      - "write SQL to show active employees"
      - "create a query for GL journals"
      - "SQL for outstanding POs"
      - "generate an AP aging SQL"
      - "write SQL for iExpense pending approval"
      - "SQL lab query"
      - "prompt to SQL"
    slots_required: [s_sql_category]
    response:
      type: navigate_and_guide
      tab: tab-sqllab
      message: >
        Opening SQL Lab. Type your requirement in the prompt box (e.g.
        "show all unpaid invoices over 10000") and click **Generate SQL**.
        The AI matches your prompt against 500+ EBS queries using keyword scoring
        (min 40% match). Out-of-scope requests (Python, weather, etc.) are
        rejected with a friendly message.
        You can also browse queries by category using the left sidebar,
        then copy or send directly to SQL Advisor / Formatter.
    out_of_scope_detection: true
    min_token_match: 0.40
    categories:
      - cat_ap:    "AP — 60 queries (invoices, payments, aging, trial balance)"
      - cat_ar:    "AR — 30 queries (customer aging, cash receipts, statements)"
      - cat_gl:    "GL — 40 queries (journals, trial balance, account analysis)"
      - cat_po:    "PO — 45 queries (PO headers, lines, distributions, receipts)"
      - cat_hrms:  "HRMS — 50 queries (employees, assignments, org hierarchy)"
      - cat_inv:   "INV — 35 queries (on-hand, valuation, item master)"
      - cat_iexp:  "iExpense — 25 queries (expense reports, credit cards)"
      - cat_fnd:   "FND/System — 40 queries (concurrent, lookups, profiles)"
      - cat_perf:  "Performance — 35 queries (AWR, top SQL, execution plan)"
      - cat_sec:   "Security — 40 queries (responsibilities, SOD, access)"
      - cat_wf:    "Workflow — 30 queries (notifications, stuck processes)"
      - cat_multi: "Multi-Org — 70 queries (OU setup, MO profile, diagnostics)"

  - skill: sql_lab_browse
    description: >
      Browse the SQL Library by module category and copy or analyse queries.
    role_required: technical
    intents:
      - browse_sql_library
      - sql_library_category
    training_phrases:
      - "browse SQL library"
      - "show AP SQL queries"
      - "list HRMS queries"
      - "SQL library"
      - "pre-written queries"
      - "show me EBS SQL examples"
      - "all GL queries"
