# =============================================================================
# DIALOG FLOWS
# =============================================================================
dialog_flows:

  - flow: ap_report_with_filters
    trigger: generate_ap_report
    steps:
      - if: s_year is empty
        action: ask_slot
        slot: s_year
        prompt: "Which fiscal year? (e.g., 2024, FY2023, or 'all')"
      - if: s_year is set
        action: load_report
        with_filters:
          year: s_year
          month: s_month

  - flow: supplier_high_payments_flow
    trigger: generate_supplier_report
    intent: high_payment_suppliers
    steps:
      - if: s_year is empty
        action: ask_slot
        slot: s_year
        prompt: "Which fiscal year for High Payments? (2022, 2023, or 2024)"
      - action: load_report
        report_key: suppliers_high_payments_by_year
        year_filter: s_year

  - flow: hrms_report_flow
    trigger: generate_hrms_report
    steps:
      - if: s_year is empty
        action: ask_slot
        slot: s_year
        prompt: "Which year for the HRMS report? (e.g., 2024)"
      - action: load_report
        with_filters:
          year: s_year

  - flow: download_after_report
    trigger: download_report
    steps:
      - if: no_report_loaded
        action: respond
        message: "Please load a report first (use chat or the EBS Reports tab), then ask me to download it."
      - if: s_export is empty
        action: ask_slot
        slot: s_export
        prompt: "Which format — CSV, Excel (.xlsx), or PDF?"
      - action: trigger_download
        format: s_export

  - flow: data_connect_upload_flow
    trigger: data_connect_excel_upload
    steps:
      - action: navigate_tab
        tab: tab-dataconnect
      - if: file_not_uploaded
        action: respond
        message: "Please drag & drop your Excel or CSV file into the upload zone, then click Auto-Map."
      - if: file_uploaded AND target_not_selected
        action: respond
        message: "File loaded! Now choose a target EBS report from the dropdown and click Auto-Map."
      - if: mapping_ready
        action: respond
        message: "Mapping looks good. Review transforms, then click Push to Reports to load your data."

  - flow: sql_lab_generate_flow
    trigger: sql_lab_prompt_to_sql
    steps:
      - action: navigate_tab
        tab: tab-sqllab
      - if: s_sql_category is empty
        action: ask_slot
        slot: s_sql_category
        prompt: "Which module? (AP, AR, GL, PO, HRMS, INV, iExpense, FND, Performance, Security, Workflow, Multi-Org)"
      - action: respond
        message: "Type your requirement in the prompt box and click Generate SQL."

  - flow: academy_topic_flow
    trigger: academy_topic_lookup
    steps:
      - action: navigate_tab
        tab: tab-academy
      - if: s_academy_module is empty
        action: ask_slot
        slot: s_academy_module
        prompt: "Which Academy module? (AP, GL, HRMS, DBA, Architecture, SOA, Testing, Security, PM, etc.)"
      - action: open_module
        module_id: s_academy_module

  - flow: delete_request_employee_flow
    trigger: delete_report_employee
    steps:
      - if: role is not employee
        action: respond
        message: "Technical users can delete directly from the report toolbar — no request needed."
      - if: s_report_key is empty
        action: ask_slot
        slot: s_report_key
        prompt: "Which report do you want to request deletion for?"
      - action: open_delete_request_form
        report_key: s_report_key

  - flow: approve_delete_flow
    trigger: approve_or_reject_delete_request
    steps:
      - if: role is not technical
        action: respond
        message: "Only Technical users can approve or reject delete requests."
      - action: open_notification_panel
        tab_panel: pending_requests

  - flow: restore_recycle_bin_flow
    trigger: restore_from_recycle_bin
    steps:
      - if: role is not technical
        action: respond
        message: "Only Technical users can access the Recycle Bin."
      - action: open_notification_panel
        tab_panel: recycle_bin

# =============================================================================
# CONTEXT INTEGRATION
# =============================================================================
context_integration:
  context_name: oracle-ebs-intelligence-hub
  context_version: "5.0"
  schema_file: ica-schema/ebs-knowledge-graph-schema.json
  resolve_entities_from_context: true

  entity_resolution:
    - entity: report_name
      node_type: EBSReport
      property: title
    - entity: report_key
      node_type: EBSReport
      property: key
    - entity: report_module
      node_type: OracleModule
      property: code
    - entity: vendor_name
      node_type: Supplier
      property: name
    - entity: employee_name
      node_type: Employee
      property: full_name
    - entity: academy_module
      node_type: AcademyModule
      property: academy_id
    - entity: sql_category
      node_type: SQLCategory
      property: category_id

  nl_query_lookup:
    enabled: true
    csv_source: ica-schema/csv/natural_language_queries.csv
    min_similarity: 0.70
    fallback_intent: show_help_menu

  knowledge_graph:
    nodes_csv:         ica-schema/csv/ebs_nodes.csv
    edges_csv:         ica-schema/csv/ebs_edges.csv
    relationships_csv: ica-schema/csv/ebs_relationships.csv

  sql_compliance_rules:
    source: ica-schema/csv/approval_rules.csv
    count: 27
    categories: [EBS Compliance, Performance, SQL Best Practice, Security, Date Handling]

  academy_modules:
    source: ica-schema/csv/expense_templates.csv
    count: 15

  sql_categories:
    source: ica-schema/csv/approver_groups.csv
    count: 12
    total_queries: "500+"

  data_connect_sources:
    source: ica-schema/csv/special_submitters.csv
    types: [excel_csv, simulated_db, live_oracle_db]

  test_scenarios:
    source: ica-schema/csv/test_scenarios.csv
    count: 35

  sample_data:
    source: ica-schema/04-sample-data.json
    modules_covered: [AP, GL, PO, HRMS, iExpense, AR, INV]

# =============================================================================
# RESPONSE TEMPLATES
# =============================================================================
response_templates:

  report_loaded:
    text: "Here is the **{report_title}** ({module}) — {row_count} records loaded. Use the filter bar for year/month/keyword, the chart button for visualisation, and download for CSV/Excel/PDF."

  report_not_found:
    text: "I couldn't find a report matching '{query}'. Try a more specific phrase or browse the EBS Reports tab — {module} module has {count} reports."

  download_success:
    text: "**{report_title}** downloaded as {format} ({row_count} rows)."

  sql_guidance:
    text: "I've opened the **{tool_name}** in the SQL Advisor tab. {instructions}"

  doc_guidance:
    text: "Document Generator is ready. Fill in all fields and click Generate — you'll get a {doc_type} with SVG diagrams."

  academy_guidance:
    text: "Opening EBS Academy — **{module_name}** module. Select a topic to see Functional View, Technical View, process flowchart, and SQL examples."

  sql_lab_result:
    text: "Here's a SQL query for: *{prompt}*\n\nMatched from the {category} library. Review it in the editor, then Copy or Send to Advisor."

  data_connect_success:
    text: "**{row_count} rows** from {source_name} mapped to **{report_title}** ({mapped_columns}/{total_columns} columns matched). Click Push to Reports to go live."

  data_connect_proxy_warning:
    text: "⚠️ Live Oracle DB requires a running proxy server at {proxy_url}. Ensure the Node.js or Python proxy is started before connecting."

  delete_request_submitted:
    text: "Delete request submitted for **{report_title}**. A Technical user will review it. The report remains live until approved."

  delete_approved:
    text: "**{report_title}** deleted. A snapshot has been saved to your Recycle Bin — restore it anytime from the 🔔 Notification Panel."

  delete_rejected:
    text: "Delete request for **{report_title}** rejected. The report remains live."

  report_restored:
    text: "**{report_title}** has been restored from the Recycle Bin and is live again."

  role_access_denied:
    text: "That feature is only available to **Technical** users. Sign in with the Technical role to access {feature_name}."

  fallback:
    text: "I didn't quite understand that. Type **help** to see what I can do, or try something like: *'Show aged payables'*, *'Review my SQL'*, or *'Explain P2P cycle'*."

# =============================================================================
# APP FUNCTIONS REFERENCE
# (Maps agent actions to the actual JS functions in ebs-reports.js)
# =============================================================================
app_function_map:

  # Reports
  load_report:                    "loadReport(reportKey)"
  filter_report_year:             "filterReport(year, month)"
  download_csv:                   "downloadCurrentReport('csv')"
  download_excel:                 "downloadCurrentReport('excel')"
  download_pdf:                   "downloadCurrentReport('pdf')"
  switch_tab:                     "switchTab(tabId, btn)"
  show_welcome:                   "goHome()"

  # SQL Advisor
  run_performance_advisor:        "runSQLAnalysis()"
  run_code_review:                "runCodeReview()"
  run_formatter:                  "formatSQL()"

  # Academy
  open_academy_module:            "openModule(moduleId)"
  open_academy_topic:             "openTopic(moduleId, topicId)"
  open_academy_assistant:         "openAcademyAssistant()"
  send_academy_message:           "sendAcademyAsstMessage()"
  close_academy_assistant:        "closeAcademyAssistant()"

  # SQL Lab
  generate_sql_from_prompt:       "generateSqlFromPrompt()"
  browse_sql_category:            "selectSqlCategory(categoryId)"
  copy_sql_lab_query:             "copySqlLabCode()"
  send_to_advisor:                "sendSqlLabToAdvisor()"
  send_to_formatter:              "sendSqlLabToFormatter()"

  # Data Connect
  dc_auto_map:                    "dcAutoMap()"
  dc_push_to_reports:             "dcPushToReports()"
  dc_clear_file:                  "dcClearFile()"
  dc_clear_mapping:               "dcClearMapping()"
  dc_apply_mapping:               "dcApplyMapping()"
  dc_preview_data:                "dcPreview()"

  # Doc Generator
  generate_document:              "generateDocument()"
  export_document_html:           "downloadDocHTML()"
  export_document_word:           "downloadDocWord()"

  # Delete Workflow
  submit_delete_request:          "submitDeleteRequest(reportKey, reason)"
  approve_delete_request:         "approveDeleteRequest(requestId)"
  reject_delete_request:          "rejectDeleteRequest(requestId)"
  restore_from_recycle_bin:       "restoreReport(reportKey)"
  open_notification_panel:        "openNotifPanel()"
  close_notification_panel:       "closeNotifPanel()"

  # Navigation / Auth
  reset_all_tab_state:            "_resetAllTabState()"
  logout:                         "rlLogout()"
  chat_clear:                     "clearChat()"
  show_toast:                     "showToast(message, type)"
