  - skill: generate_inv_report
    description: >
      Show Inventory report — Inventory Valuation.
    intents:
      - inventory_valuation
    training_phrases:
      - "inventory valuation"
      - "stock value"
      - "inventory on hand value"
      - "warehouse stock report"
      - "INV valuation"
      - "stock at hand"
      - "item cost report"
    slots_required: [s_year, s_month]
    response:
      type: report_action
      report_key_map:
        inventory_valuation: inventory_valuation
    fallback: "INV report available: Inventory Valuation."

  # ────────────────────────────────────────────────────────────────────────────
  # GROUP 2 — SQL ADVISOR (Technical only — tab-sql)
  # ────────────────────────────────────────────────────────────────────────────

  - skill: sql_performance_advisor
    description: >
      Guide user to SQL Performance Advisor sub-tab for execution cost
      estimation and automatic query optimisation.
    role_required: technical
    intents:
      - sql_performance
      - slow_query
      - sql_optimise
      - execution_plan
    training_phrases:
      - "my SQL is slow"
      - "optimise my SQL"
      - "SQL performance"
      - "long running query"
      - "query taking too long"
      - "query optimisation"
      - "execution plan"
      - "SQL cost estimate"
      - "how to speed up this SQL"
      - "full table scan"
      - "missing index"
    response:
      type: navigate_and_guide
      tab: tab-sql
      subtab: sql-perf-tab
      message: >
        Opening the SQL Performance Advisor. Paste your query and click
        **Analyse & Optimise** — it estimates execution cost before and after,
        detects missing ORG_ID / SELECT * / correlated subqueries, and generates
        an optimised rewrite with comments. Use **Side-by-Side Compare** to review differences.

  - skill: sql_code_review
    description: >
      Guide user to SQL Code Review sub-tab — 27 Oracle EBS compliance and
      best-practice checks with a quality score out of 100.
    role_required: technical
    intents:
      - code_review
      - sql_quality
      - check_ebs_standards
    training_phrases:
      - "review my SQL"
      - "check SQL quality"
      - "SQL code review"
      - "Oracle EBS standards check"
      - "is my SQL correct"
      - "SQL best practices"
      - "check for org_id filter"
      - "check datetrack filter"
      - "SQL compliance check"
      - "score my SQL"
    response:
      type: navigate_and_guide
      tab: tab-sql
      subtab: sql-codereview-tab
      message: >
        Opening Code Review. Paste your SQL and click **Run Code Review** —
        it checks 27 Oracle EBS standards across 5 categories (Compliance,
        Performance, Best Practice, Security, Date Handling) and gives a
        quality score out of 100. Critical issues score −20 each.
    code_review_checks:
      categories:
        - name: EBS Compliance
          checks:
            - RULE_001: "Multi-Org ORG_ID Required — all _ALL tables need AND org_id filter"
            - RULE_002: "DateTrack PER_ALL_PEOPLE_F — must use BETWEEN effective_start_date AND effective_end_date"
            - RULE_003: "DateTrack PER_ALL_ASSIGNMENTS_F + PRIMARY_FLAG = 'Y'"
            - RULE_004: "Exclude Cancelled Invoices — AND cancelled_date IS NULL"
            - RULE_005: "Exclude Void Cheques — AND void_date IS NULL"
            - RULE_006: "GL Summary Flag — AND summary_flag = 'N' AND enabled_flag = 'Y'"
            - RULE_007: "iExpense SOURCE Filter — AND source = 'NonValidatedWebExpense'"
            - RULE_014: "GL_BALANCES currency_code filter required"
            - RULE_015: "PO authorization_status = 'APPROVED' unless draft needed"
            - RULE_016: "AP payment_status_flag = 'Y'/'N'"
            - RULE_017: "AR status != 'CL' for open items"
            - RULE_018: "INV organization_id filter required"
            - RULE_019: "FND_LOOKUP_VALUES — use _VL view or filter by LANGUAGE"
            - RULE_020: "GL period status — closing_status = 'O'"
            - RULE_021: "Hardcoded ORG_ID — use mo_global.get_current_org_id()"
        - name: Performance
          checks:
            - RULE_008: "SELECT * Wildcard Prohibited"
            - RULE_009: "Correlated Scalar Subquery — use JOIN instead"
            - RULE_011: "LIKE Leading Wildcard — forces full table scan"
            - RULE_022: "Missing TRUNC on date comparison"
            - RULE_023: "Implicit column conversion suppresses index"
            - RULE_024: "Cartesian Join Risk — missing JOIN predicate"
        - name: SQL Best Practice
          checks:
            - RULE_012: "NOT IN with NULLs — use NOT EXISTS"
            - RULE_013: "ROWNUM with ORDER BY — wrap in subquery"
            - RULE_026: "Missing NOVALIDATE on FK constraints"
            - RULE_027: "DBMS_OUTPUT in production code"
        - name: Security
          checks:
            - RULE_010: "EXECUTE IMMEDIATE without bind variables"
            - RULE_025: "Literal values in WHERE — use bind variables"

  - skill: sql_code_formatter
    description: >
      Guide user to SQL Code Formatter — formats SELECT/DML/PL/SQL with
      keyword casing options, one-column-per-line, and EBS header block.
    role_required: technical
    intents:
      - format_sql
      - beautify_sql
      - clean_sql
    training_phrases:
      - "format my SQL"
      - "beautify SQL"
      - "clean up SQL"
      - "SQL formatter"
      - "indent my query"
      - "uppercase SQL keywords"
      - "fix SQL formatting"
      - "add EBS header comment"
    response:
      type: navigate_and_guide
      tab: tab-sql
      subtab: sql-formatter-tab
      message: >
        Opening Code Formatter. Paste your SQL, choose keyword casing (UPPER/lower/Title),
        indent size, and click **Format SQL**. It handles SELECT, INSERT/UPDATE/DELETE,
        and PL/SQL blocks — one column per line, one JOIN per line, plus an Oracle EBS
        header comment block and complexity stats.

  # ────────────────────────────────────────────────────────────────────────────
  # GROUP 3 — EBS ACADEMY (Technical only — tab-academy)
  # ────────────────────────────────────────────────────────────────────────────

