    response:
      type: navigate_and_guide
      tab: tab-sqllab
      message: >
        Opening SQL Lab library. Select a category from the left sidebar
        to browse all queries. Click a query to view its full SQL, then use
        **Copy**, **Send to Advisor**, or **Send to Formatter**.

  # ────────────────────────────────────────────────────────────────────────────
  # GROUP 5 — DATA CONNECT (Employee + Technical — tab-dataconnect)
  # ────────────────────────────────────────────────────────────────────────────

  - skill: data_connect_excel_upload
    description: >
      Guide user to upload an Excel or CSV file and map columns to an EBS report.
      Uses dcAutoMap() for fuzzy column matching. Supports transforms and preview.
    intents:
      - upload_excel
      - import_csv
      - load_own_data
    training_phrases:
      - "upload my Excel file"
      - "import CSV"
      - "load my own data"
      - "use my spreadsheet"
      - "drag and drop Excel"
      - "bring in external data"
      - "upload vendors from Excel"
      - "import employee data from file"
    slots_required: [s_data_source]
    response:
      type: navigate_and_guide
      tab: tab-dataconnect
      source: excel
      message: >
        Opening Data Connect — Excel/CSV Upload.
        1. Drag & drop or click to select your .xlsx or .csv file.
        2. Column types are auto-detected (number / date / text / bool).
        3. Choose a target EBS report → click **Auto-Map** to fuzzy-match your columns.
        4. Optionally apply transforms (TRIM, UPPER, Format Date, etc.).
        5. **Preview** the mapped data with null% and unique count stats.
        6. Click **Push to Reports** → the selected report now shows your data live.
    column_mapping:
      function: dcAutoMap()
      similarity_threshold: 0.60
      fallback: manual_selection

  - skill: data_connect_simulated_db
    description: >
      Guide user to run a simulated DB query using real EBS table names
      — matched to demo data without needing a live DB connection.
    intents:
      - simulated_db_query
      - test_sql_without_db
    training_phrases:
      - "simulate a DB query"
      - "test without database"
      - "run a simulated query"
      - "query demo data"
      - "no database access"
      - "EBS table demo"
    response:
      type: navigate_and_guide
      tab: tab-dataconnect
      source: simulated
      message: >
        Opening Data Connect — Simulated DB.
        Select the **DB Query** source, enter a SELECT statement using real
        Oracle EBS table names (e.g. ap_invoices_all, per_all_people_f),
        and click **Run Query**. Results are matched to demo data instantly —
        no DB connection required. Then map and push to any report.
    supported_tables:
      - ap_invoices_all
      - ap_suppliers
      - ar_customers
      - gl_je_headers
      - per_all_people_f
      - po_headers_all
      - fnd_concurrent_requests
      - mtl_system_items_b

  - skill: data_connect_live_db
    description: >
      Guide user to connect to a live Oracle EBS database via the proxy server.
      Requires host, port, SID, username, password, and a running proxy.
    intents:
      - live_db_connect
      - real_oracle_db
    training_phrases:
      - "connect to live Oracle DB"
      - "production database"
      - "live EBS connection"
      - "real data from database"
      - "JDBC connection"
      - "connect to EBS prod"
    response:
      type: navigate_and_guide
      tab: tab-dataconnect
      source: live_db
      message: >
        Opening Data Connect — Live Oracle DB.
        ⚠️ This requires a running backend proxy server.
        Enter: Host, Port (1521), SID (e.g. EBSPROD), Username, Password, Proxy URL.
        Click **Test Connection**, then run your SELECT query, map columns, and push.
        Proxy API contract: POST /query with body { sql, host, port, sid, user, pass }
        Returns: { columns: [...], rows: [[...], [...]] }
    proxy_required: true
    proxy_contract:
      endpoint: POST /query
      request_fields: [sql, host, port, sid, user, pass]
      response_fields: [columns, rows]

