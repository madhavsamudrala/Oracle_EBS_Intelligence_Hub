  - skill: generate_ar_report
    description: >
      Show Accounts Receivable reports — AR Aging, Customer Statement.
    intents:
      - ar_aging
      - customer_statement
    training_phrases:
      - "accounts receivable aging"
      - "AR aging"
      - "outstanding receivables"
      - "customer outstanding balance"
      - "overdue invoices from customers"
